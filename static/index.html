<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarthMagFieldSim · 动态节点编辑器</title>
<link rel="stylesheet" href="/vendor/litegraph.css">
<style>
    :root {
        --bg: #0d1117; --panel: #161b22; --border: #30363d;
        --text: #c9d1d9; --dim: #8b949e; --accent: #58a6ff; --accent2: #1f6feb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--bg); color: var(--text); overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
        height: 100vh; display: flex; flex-direction: column;
    }
    /* ---- 顶栏 ---- */
    #topbar {
        height: 46px; flex: 0 0 46px; display: flex; align-items: center; gap: 10px;
        padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    #topbar .title { font-weight: 700; color: var(--accent); font-size: 0.95rem; }
    .badge {
        padding: 2px 8px; border-radius: 10px; background: #21262d;
        border: 1px solid var(--border); color: var(--dim); font-size: 0.72rem;
    }
    .badge.ok { color: #3fb950; border-color: #238636; }
    button {
        background: #21262d; color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.75rem;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    #topbar input[type=number] { width: 64px; background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font-size: 0.75rem; }
    #bake-progress { flex: 1; display: flex; align-items: center; gap: 8px; }
    #bake-progress.hidden { display: none; }
    #bake-bar-wrap { flex: 1; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
    #bake-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #1f6feb, #3fb950); transition: width 0.3s; }
    #bake-text { font-size: 0.72rem; color: var(--dim); white-space: nowrap; }
    /* ---- 主区 ---- */
    #main { flex: 1; display: flex; min-height: 0; }
    #editor-wrap { flex: 1; position: relative; border-right: 1px solid var(--border); }
    #editor-canvas { width: 100%; height: 100%; }
    #palette {
        position: absolute; top: 10px; left: 12px; width: 280px; max-height: 60%;
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        display: flex; flex-direction: column; z-index: 100; box-shadow: 0 6px 24px rgba(0,0,0,.5);
    }
    #palette.hidden { display: none; }
    #palette-filter { margin: 8px; padding: 5px 8px; background: #21262d; color: var(--text);
        border: 1px solid var(--border); border-radius: 5px; font-size: 0.75rem; }
    #palette-list { overflow-y: auto; }
    .palette-item {
        display: block; width: 100%; text-align: left; background: none; border: none;
        color: var(--text); padding: 7px 12px; font-size: 0.75rem; cursor: pointer;
        border-top: 1px solid rgba(255,255,255,0.04);
    }
    .palette-item:hover { background: #21262d; color: var(--accent); }
    #right { flex: 0 0 420px; display: flex; flex-direction: column; }
    #viewport-wrap { flex: 1; position: relative; border-bottom: 1px solid var(--border); min-height: 240px; }
    #viewport { position: absolute; inset: 0; }
    #props { flex: 1; overflow-y: auto; padding: 10px 12px; min-height: 120px; }
    #props .panel-title { font-weight: 700; color: var(--accent); margin-bottom: 8px; font-size: 0.8rem; }
    #props .hint { color: var(--dim); font-size: 0.75rem; }
    .prop-row { margin-bottom: 8px; }
    .prop-row label { display: block; color: var(--dim); font-size: 0.72rem; margin-bottom: 2px; }
    .prop-row input[type=range] { width: 100%; }
    .prop-row input[type=number], .prop-row input[type=text], .prop-row select {
        width: 100%; background: #21262d; color: var(--text); border: 1px solid var(--border);
        border-radius: 5px; padding: 3px 6px; font-size: 0.75rem;
    }
    .prop-row .val { color: var(--accent); float: right; font-size: 0.72rem; }
    .node-title { font-weight: 700; margin-bottom: 6px; }
    .outputs-row { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
    #outputs-json { width: 100%; height: 90px; background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 5px; font-size: 0.72rem; padding: 4px 6px; font-family: Consolas, monospace; }
    #toast {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        background: #b62324; color: #fff; padding: 8px 18px; border-radius: 8px;
        display: none; z-index: 999; font-size: 0.8rem; max-width: 70%;
    }
</style>
</head>
<body>
<div id="topbar">
    <span class="title">🧲 EarthMagFieldSim</span>
    <span id="conn-status" class="badge">连接中…</span>
    <span id="graph-ver" class="badge">图 v0</span>
    <span id="ptc-badge" class="badge">粒子 –</span>
    <button id="btn-add-node">➕ 添加节点</button>
    <button id="btn-layout">🧹 自动布局</button>
    <button id="btn-upload" class="primary">⬆ 应用图到服务器</button>
    <button id="btn-reset">↺ 重置为服务器图</button>
    <button id="btn-respawn">🔄 重置粒子</button>
    <label style="color:var(--dim);font-size:0.72rem;">粒子数
        <input type="number" id="ptc-input" value="5000" min="1" max="20000" step="100">
    </label>
    <div id="bake-progress" class="hidden">
        <div id="bake-bar-wrap"><div id="bake-bar"></div></div>
        <span id="bake-text">⏳ 烘焙中…</span>
    </div>
</div>
<div id="main">
    <div id="editor-wrap">
        <canvas id="editor-canvas"></canvas>
        <div id="palette" class="hidden">
            <input id="palette-filter" placeholder="搜索节点类型...">
            <div id="palette-list"></div>
        </div>
    </div>
    <div id="right">
        <div id="viewport-wrap"><div id="viewport"></div></div>
        <div id="props">
            <div class="panel-title">⚙ 节点属性<span id="props-node" style="float:right;color:var(--dim);"></span></div>
            <div id="props-body"><div class="hint">点击画布中的节点编辑其参数;双击空白处或点「添加节点」放入新节点。</div></div>
            <div class="outputs-row">
                <div class="panel-title">🔌 输出槽位</div>
                <div class="hint">推荐:用「输出槽(最终节点)」声明输出(连线 + 填 slot 名)。此 JSON 仅作显式覆盖,可留空。</div>
                <textarea id="outputs-json" spellcheck="false">{}</textarea>
            </div>
        </div>
    </div>
</div>
<div id="toast"></div>

<script src="/vendor/litegraph.js"></script>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/OrbitControls.js"></script>
<script src="/renderer.js"></script>
<script src="/editor.js"></script>
<script src="/protocol.js"></script>
</body>
</html>
